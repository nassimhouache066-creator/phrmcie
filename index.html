<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صيدلية العائلة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">
      <i class="fa-solid fa-capsules ml-2"></i> صيدلية العائلة
    </h1>

    <!-- Form -->
    <form id="med-form" class="space-y-4 mb-8">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">اسم الدواء</label>
        <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">الكمية</label>
          <input type="number" id="qty" min="1" value="1" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">تاريخ الصلاحية</label>
          <input type="date" id="exp" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">المكان</label>
        <input type="text" id="loc" placeholder="مثال: الخزانة الرئيسية" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">ملاحظات</label>
        <input type="text" id="notes" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
        إضافة الدواء
      </button>
    </form>

    <!-- List -->
    <h2 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2">الأدوية المسجلة</h2>
    <div id="med-list" class="space-y-3">
      <p class="text-center text-gray-400 py-4">جاري تحميل الأدوية...</p>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyD-family-pharmacy-app-key-01",
      authDomain: "family-pharmacy-app.firebaseapp.com",
      projectId: "family-pharmacy-app",
      storageBucket: "family-pharmacy-app.appspot.com",
      messagingSenderId: "1098234821",
      appId: "1:1098234821:web:08234a87c2b"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const form = document.getElementById('med-form');
    const medList = document.getElementById('med-list');

    // Real-time Sync
    db.collection('family_medicines').orderBy('createdAt', 'desc')
      .onSnapshot((snapshot) => {
        if (snapshot.empty) {
          medList.innerHTML = '<p class="text-center text-gray-400 py-4">لا توجد أدوية مضافة حالياً.</p>';
          return;
        }

        let html = '';
        snapshot.forEach((doc) => {
          const m = doc.data();
          html += `
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex justify-between items-center">
              <div>
                <h3 class="font-bold text-gray-800">${escapeHtml(m.name)}</h3>
                <p class="text-xs text-gray-500">الكمية: ${m.quantity} | الصلاحية: ${m.exp || '-'}</p>
                <p class="text-xs text-indigo-600 mt-0.5">المكان: ${escapeHtml(m.loc || 'غير محدد')} ${m.notes ? '| ' + escapeHtml(m.notes) : ''}</p>
              </div>
              <button onclick="deleteMed('${doc.id}')" class="text-red-500 hover:text-red-700 p-2">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          `;
        });
        medList.innerHTML = html;
      });

    // Add
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await db.collection('family_medicines').add({
          name: document.getElementById('name').value.trim(),
          quantity: parseInt(document.getElementById('qty').value) || 1,
          exp: document.getElementById('exp').value,
          loc: document.getElementById('loc').value.trim(),
          notes: document.getElementById('notes').value.trim(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        form.reset();
        document.getElementById('qty').value = 1;
      } catch (err) {
        alert("حدث خطأ أثناء الإضافة.");
      }
    });

    // Delete
    async function deleteMed(id) {
      if (confirm("هل تريد حذف هذا الدواء؟")) {
        try {
          await db.collection('family_medicines').doc(id).delete();
        } catch (err) {
          alert("حدث خطأ أثناء الحذف.");
        }
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
