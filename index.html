<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacie Family</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-28">

  <!-- Header Section -->
  <header class="bg-[#054d3b] text-white pt-5 pb-6 px-4 shadow-lg rounded-b-3xl">
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center mb-3">
        <!-- Icons Left (Refresh, Manage, WhatsApp) -->
        <div class="flex items-center gap-2">
          
          <button onclick="fetchSheetData()" class="w-10 h-10 rounded-2xl bg-[#09634e] hover:bg-[#0c785f] flex justify-center items-center text-sky-300 text-lg shadow-inner transition" title="تحديث البيانات">
            <i id="refresh-icon" class="fa-solid fa-arrows-rotate"></i>
          </button>

          <button onclick="openManageModal()" class="w-10 h-10 rounded-2xl bg-[#09634e] hover:bg-[#0c785f] flex justify-center items-center text-amber-300 text-lg shadow-inner transition relative" title="إدارة وإزالة الأدوية">
            <i class="fa-solid fa-boxes-packing"></i>
            <span id="manage-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-[#054d3b]">0</span>
          </button>

          <button onclick="shareApp()" class="w-10 h-10 rounded-2xl bg-[#09634e] hover:bg-[#0c785f] flex justify-center items-center text-emerald-300 text-lg shadow-inner transition" title="مشاركة التطبيق">
            <i class="fa-brands fa-whatsapp"></i>
          </button>
        </div>

        <!-- Title -->
        <div class="text-right flex flex-col items-end justify-center pt-1">
          <span class="text-xl font-extrabold tracking-wide">Pharmacie Family</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 space-y-4">

    <!-- Stat Cards -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center justify-center">
        <span id="stat-total" class="text-2xl font-extrabold text-slate-800">0</span>
        <span class="text-[11px] font-bold text-slate-500 mt-0.5">إجمالي الأدوية</span>
      </div>
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center justify-center">
        <span id="stat-expiring" class="text-2xl font-extrabold text-amber-600">0</span>
        <span class="text-[11px] font-bold text-slate-500 mt-0.5">تنتهي قريباً</span>
      </div>
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center justify-center">
        <span id="stat-expired" class="text-2xl font-extrabold text-rose-600">0</span>
        <span class="text-[11px] font-bold text-slate-500 mt-0.5">منتهية الصلاحية</span>
      </div>
    </div>

    <!-- Search Box Container -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3 relative">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="ابحث باسم الدواء (الأحرف الأولى)..." class="w-full pr-4 pl-9 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-600 transition" autocomplete="off">
      </div>
    </div>

    <!-- Active Medicines Cards View -->
    <div id="meds-container" class="space-y-3">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-400 text-xs">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-600 mb-2 block"></i>
        جاري جلب الأدوية من السحابة...
      </div>
    </div>

  </main>

  <!-- Floating Add Button -->
  <div class="fixed bottom-5 left-0 right-0 max-w-md mx-auto px-4 z-20">
    <button onclick="openModal()" class="w-full bg-[#0d9488] hover:bg-teal-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-xl transition flex justify-center items-center gap-2 text-sm border border-teal-400/30">
      <i class="fa-solid fa-plus text-lg"></i> إضافة دواء جديد
    </button>
  </div>

  <!-- Manage / Delete Medicines Modal -->
  <div id="manage-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-3">
        <button onclick="closeManageModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <h3 class="text-base font-extrabold text-slate-800">إدارة الأدوية</h3>
      </div>
      <div id="manage-list-container" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>
    </div>
  </div>

  <!-- Add Medicine Modal -->
  <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <h3 id="modal-title" class="text-base font-extrabold text-slate-800">إضافة دواء جديد</h3>
      </div>

      <form id="add-form" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">اسم الدواء</label>
          <input type="text" id="name" required placeholder="مثال: Doliprane 1000mg" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">الكمية</label>
            <input type="number" id="qty" min="1" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ الانتهاء</label>
            <input type="date" id="exp" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">مكان الحفظ</label>
          <input type="text" id="loc" placeholder="مثال: درج المطبخ" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">ملاحظات</label>
          <input type="text" id="notes" placeholder="مثال: بعد الأكل" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        </div>
        <button type="submit" id="save-btn" class="w-full bg-[#054d3b] hover:bg-[#07634d] text-white font-bold py-3 rounded-xl text-xs transition mt-2">
          حفظ في جدول جوجل
        </button>
      </form>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBy6VMkNOokA0wRIsOUVcLgOyAgZtAm1q0zd08gx5RLQjL8Y6bNlUnGNpbSutXFDXDog/exec";

    let allMeds = [];

    async function fetchSheetData() {
      const icon = document.getElementById('refresh-icon');
      icon.classList.add('fa-spin');
      
      try {
        const res = await fetch(SCRIPT_URL);
        allMeds = await res.json();
      } catch (e) {
        console.error("خطأ:", e);
      }
      
      icon.classList.remove('fa-spin');
      refreshUI();
    }

    function refreshUI() {
      updateStats();
      renderMeds();
      renderManageList();
    }

    function updateStats() {
      const today = new Date().toISOString().split('T')[0];
      let expiredCount = 0;
      let expiringCount = 0;

      allMeds.forEach(m => {
        let expDate = m.exp ? new Date(m.exp).toISOString().split('T')[0] : '';
        if (expDate && expDate < today) expiredCount++;
      });

      document.getElementById('stat-total').innerText = allMeds.length;
      document.getElementById('stat-expiring').innerText = expiringCount;
      document.getElementById('stat-expired').innerText = expiredCount;
      document.getElementById('manage-badge').innerText = allMeds.length;
    }

    function renderMeds() {
      const container = document.getElementById('meds-container');
      const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();

      if (allMeds.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-400 text-xs">الجدول فارغ حالياً. ابدأ بإضافة الأدوية!</div>`;
        return;
      }

      let matches = allMeds.filter(m => !searchTerm || (m.name && m.name.toLowerCase().startsWith(searchTerm)));

      if (matches.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-400 text-xs">لم يتم العثور على دواء.</div>`;
        return;
      }

      container.innerHTML = matches.map(m => {
        let expDate = m.exp ? new Date(m.exp).toISOString().split('T')[0] : '-';
        return `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-2 text-xs">
          <div class="flex justify-between items-center border-b pb-2">
            <button onclick="deleteMed('${m.id}')" class="text-rose-500 hover:text-rose-700" title="حذف"><i class="fa-solid fa-trash-can"></i></button>
            <h3 class="font-extrabold text-sm text-slate-800">${escapeHtml(m.name)} (x${m.quantity || 1})</h3>
          </div>
          <p class="text-slate-500">الصلاحية: <span class="font-bold">${expDate}</span> | المكان: ${escapeHtml(m.loc || 'غير محدد')}</p>
          ${m.notes ? `<p class="text-emerald-700">ملاحظة: ${escapeHtml(m.notes)}</p>` : ''}
        </div>
      `}).join('');
    }

    function renderManageList() {
      const container = document.getElementById('manage-list-container');
      if (allMeds.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 py-4 text-xs">لا توجد أدوية.</p>';
        return;
      }
      container.innerHTML = allMeds.map(m => `
        <div class="bg-slate-50 border rounded-xl p-2.5 flex justify-between items-center text-xs">
          <button onclick="deleteMed('${m.id}')" class="text-rose-500 font-bold bg-rose-100 px-3 py-1 rounded-lg">إزالة</button>
          <span class="font-bold">${escapeHtml(m.name)}</span>
        </div>
      `).join('');
    }

    document.getElementById('search-input').addEventListener('input', renderMeds);

    function openModal() {
      document.getElementById('add-form').reset();
      document.getElementById('qty').value = 1;
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('add-modal').classList.add('hidden'); }
    function openManageModal() { document.getElementById('manage-modal').classList.remove('hidden'); }
    function closeManageModal() { document.getElementById('manage-modal').classList.add('hidden'); }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.innerText = "جاري الحفظ...";
      btn.disabled = true;
      
      const medData = {
        id: 'med_' + Date.now(),
        name: document.getElementById('name').value.trim(),
        quantity: document.getElementById('qty').value,
        exp: document.getElementById('exp').value,
        loc: document.getElementById('loc').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "add", data: medData })
        });
        
        document.getElementById('add-form').reset();
        closeModal();
        await fetchSheetData();
      } catch (err) {
        console.error(err);
      }
      
      btn.innerText = "حفظ في جدول جوجل";
      btn.disabled = false;
    });

    async function deleteMed(id) {
      if (confirm("هل أنت متأكد من إزالة هذا الدواء نهائياً؟")) {
        try {
          document.getElementById('meds-container').innerHTML = `<div class="text-center text-slate-400 text-xs p-6"><i class="fa-solid fa-spinner fa-spin text-2xl text-rose-500 mb-2 block"></i>جاري الحذف...</div>`;
          
          await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "delete", data: { id: id } })
          });
          
          await fetchSheetData();
        } catch (err) {
          console.error(err);
        }
      }
    }

    function shareApp() {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('صيدلية العائلة - تابع الأدوية المنزلية عبر الرابط:\n' + window.location.href)}`, '_blank');
    }

    function escapeHtml(str) {
      return (str || '').toString().replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    fetchSheetData();
  </script>
</body>
</html>
