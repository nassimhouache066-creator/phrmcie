<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharmacie Familiale - دليل وتتبع الأدوية المنزلية</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-28">

  <!-- Header Section -->
  <header class="bg-[#054d3b] text-white pt-5 pb-6 px-4 shadow-lg rounded-b-3xl">
    <div class="max-w-md mx-auto">
      <div class="flex justify-between items-center mb-3">
        <!-- Icons Left (Manage & WhatsApp Share) -->
        <div class="flex items-center gap-2">
          <button onclick="openManageModal()" class="w-10 h-10 rounded-2xl bg-[#09634e] hover:bg-[#0c785f] flex justify-center items-center text-amber-300 text-lg shadow-inner transition relative" title="إدارة وإزالة الأدوية">
            <i class="fa-solid fa-boxes-packing"></i>
            <span id="manage-badge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-[#054d3b]">0</span>
          </button>

          <button onclick="shareApp()" class="w-10 h-10 rounded-2xl bg-[#09634e] hover:bg-[#0c785f] flex justify-center items-center text-emerald-300 text-lg shadow-inner transition" title="مشاركة التطبيق عبر الواتساب">
            <i class="fa-brands fa-whatsapp"></i>
          </button>
        </div>

        <!-- Badges & Title Center/Right -->
        <div class="text-right flex flex-col items-end">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="bg-[#f0b429] text-emerald-950 font-bold text-[10px] px-2 py-0.5 rounded-full">عائلي</span>
            <span class="text-lg font-extrabold tracking-wide">Pharmacie Familiale</span>
          </div>
          <p class="text-emerald-100 text-xs">دليل وتتبع الأدوية المنزلية</p>
        </div>
      </div>

      <!-- Live Sync Badge -->
      <div class="flex justify-center mt-3">
        <div class="bg-[#033629] text-emerald-200 text-xs px-3 py-1 rounded-full flex items-center gap-2 border border-emerald-800/50">
          <i class="fa-solid fa-bolt text-yellow-400 text-xs animate-pulse"></i>
          <span>تزامن سحابي فوري ومباشر</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-5 space-y-4">

    <!-- Stat Cards -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center justify-center">
        <div class="w-7 h-7 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-xs mb-1">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <span id="stat-total" class="text-2xl font-extrabold text-slate-800">0</span>
        <span class="text-[11px] font-bold text-slate-500 mt-0.5">إجمالي الأدوية</span>
      </div>

      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center justify-center">
        <div class="w-7 h-7 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center text-xs mb-1">
          <i class="fa-solid fa-clock"></i>
        </div>
        <span id="stat-expiring" class="text-2xl font-extrabold text-amber-600">0</span>
        <span class="text-[11px] font-bold text-slate-500 mt-0.5">تنتهي قريباً</span>
      </div>

      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center justify-center">
        <div class="w-7 h-7 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-xs mb-1">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <span id="stat-expired" class="text-2xl font-extrabold text-rose-600">0</span>
        <span class="text-[11px] font-bold text-slate-500 mt-0.5">منتهية الصلاحية</span>
      </div>
    </div>

    <!-- Search Box Container -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3 relative">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="ابحث باسم الدواء بالفرنسية (الأحرف الأولى)..." class="w-full pr-4 pl-9 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:bg-white transition" autocomplete="off">
        
        <!-- Live Suggestions Dropdown -->
        <div id="suggestions-box" class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-30 hidden max-h-48 overflow-y-auto"></div>
      </div>
    </div>

    <!-- Active Medicines Cards View -->
    <div id="meds-container" class="space-y-3">
      <!-- Dynamic list -->
    </div>

  </main>

  <!-- Floating Add Button -->
  <div class="fixed bottom-5 left-0 right-0 max-w-md mx-auto px-4 z-20">
    <button onclick="openModal()" class="w-full bg-[#0d9488] hover:bg-teal-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-xl transition flex justify-center items-center gap-2 text-sm border border-teal-400/30">
      <i class="fa-solid fa-plus text-lg"></i> إضافة دواء جديد
    </button>
  </div>

  <!-- Manage / Delete Medicines Modal -->
  <div id="manage-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-3">
        <button onclick="closeManageModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <h3 class="text-base font-extrabold text-slate-800 flex items-center gap-2">
          إدارة وإزالة الأدوية
          <i class="fa-solid fa-boxes-packing text-amber-500"></i>
        </h3>
      </div>

      <p class="text-xs text-slate-500 text-right">جميع الأدوية المتوفرة في الصيدلية العائلية:</p>

      <div id="manage-list-container" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>
    </div>
  </div>

  <!-- Add / Edit Medicine Modal -->
  <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 transform transition-all">
      <div class="flex justify-between items-center border-b pb-3">
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <h3 id="modal-title" class="text-base font-extrabold text-slate-800">إضافة دواء جديد</h3>
      </div>

      <form id="add-form" class="space-y-3">
        <input type="hidden" id="med-id">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">اسم الدواء (بالفرنسية)</label>
          <input type="text" id="name" required placeholder="مثال: Doliprane 1000mg" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">الكمية</label>
            <input type="number" id="qty" min="1" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">تاريخ الانتهاء</label>
            <input type="date" id="exp" required class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">مكان الحفظ</label>
          <input type="text" id="loc" placeholder="مثال: درج المطبخ الأيمن" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">ملاحظات</label>
          <input type="text" id="notes" placeholder="مثال: بعد الأكل" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-600 focus:outline-none">
        </div>

        <button type="submit" id="save-btn-text" class="w-full bg-[#054d3b] hover:bg-[#07634d] text-white font-bold py-3 rounded-xl text-xs transition mt-2 flex justify-center items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> حفظ الدواء
        </button>
      </form>
    </div>
  </div>

  <script>
    let allMeds = JSON.parse(localStorage.getItem('family_pharmacy_data') || '[]');

    function refreshApp() {
      updateStats();
      renderMeds();
      renderManageList();
    }

    function updateStats() {
      const today = new Date().toISOString().split('T')[0];
      const nextMonth = new Date();
      nextMonth.setDate(nextMonth.getDate() + 30);
      const nextMonthStr = nextMonth.toISOString().split('T')[0];

      let expiredCount = 0;
      let expiringCount = 0;

      allMeds.forEach(m => {
        if (m.exp < today) expiredCount++;
        else if (m.exp >= today && m.exp <= nextMonthStr) expiringCount++;
      });

      document.getElementById('stat-total').innerText = allMeds.length;
      document.getElementById('stat-expiring').innerText = expiringCount;
      document.getElementById('stat-expired').innerText = expiredCount;
      document.getElementById('manage-badge').innerText = allMeds.length;
    }

    function renderMeds() {
      const container = document.getElementById('meds-container');
      const searchTerm = document.getElementById('search-input').value.trim().toLowerCase();
      const today = new Date().toISOString().split('T')[0];

      if (allMeds.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-400 text-xs">
            <i class="fa-solid fa-capsules text-3xl text-emerald-600/30 mb-2 block"></i>
            لا توجد أدوية مضافة حالياً. انقر على "+ إضافة دواء جديد" لإضافة أول دواء.
          </div>`;
        return;
      }

      let matches = allMeds.filter(m => !searchTerm || m.name.toLowerCase().startsWith(searchTerm));

      if (matches.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center text-slate-400 text-xs">
            <i class="fa-solid fa-circle-exclamation text-2xl text-amber-500 mb-2 block"></i>
            لم يتم العثور على دواء يبدأ بـ "${escapeHtml(searchTerm)}".
          </div>`;
        return;
      }

      container.innerHTML = matches.map(m => {
        const isExpired = m.exp < today;
        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 space-y-3">
            <div class="flex justify-between items-start border-b pb-3">
              <div class="flex items-center gap-1 text-slate-400">
                <button onclick="editMed('${m.id}')" class="hover:text-indigo-600 p-1.5 transition" title="تعديل">
                  <i class="fa-solid fa-pen-to-square text-sm"></i>
                </button>
                <button onclick="deleteMed('${m.id}')" class="hover:text-rose-600 p-1.5 transition" title="حذف">
                  <i class="fa-solid fa-trash-can text-sm"></i>
                </button>
              </div>
              <div class="text-right">
                <span class="bg-emerald-100 text-emerald-800 font-extrabold px-2.5 py-0.5 rounded-md text-xs inline-block mb-1">الكمية: x${m.quantity}</span>
                <h3 class="text-base font-extrabold text-slate-800">${escapeHtml(m.name)}</h3>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-right">
                <span class="text-slate-400 block text-[10px] mb-0.5">تاريخ الصلاحية</span>
                <span class="font-bold ${isExpired ? 'text-rose-600' : 'text-slate-700'}">${m.exp || '-'} ${isExpired ? '(منتهي)' : ''}</span>
              </div>
              <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-right">
                <span class="text-slate-400 block text-[10px] mb-0.5">مكان الحفظ</span>
                <span class="font-bold text-slate-700">${escapeHtml(m.loc || 'غير محدد')}</span>
              </div>
            </div>

            ${m.notes ? `
            <div class="bg-emerald-50/60 p-2.5 rounded-xl border border-emerald-100 text-right text-xs">
              <span class="text-emerald-800 font-bold block text-[10px] mb-0.5">ملاحظات الاستعمال</span>
              <span class="text-slate-600">${escapeHtml(m.notes)}</span>
            </div>` : ''}
          </div>
        `;
      }).join('');
    }

    function renderManageList() {
      const container = document.getElementById('manage-list-container');
      if (allMeds.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-400 py-6 text-xs">لا توجد أدوية لإدارتها.</p>';
        return;
      }

      container.innerHTML = allMeds.map(m => `
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex justify-between items-center text-xs">
          <button onclick="deleteMed('${m.id}')" class="text-rose-500 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 p-2 rounded-lg transition text-xs flex items-center gap-1 font-bold">
            <i class="fa-solid fa-trash-can"></i> إزالة
          </button>
          <div class="text-right">
            <h4 class="font-extrabold text-slate-800">${escapeHtml(m.name)}</h4>
            <span class="text-[10px] text-slate-500">الكمية: ${m.quantity} | المكان: ${escapeHtml(m.loc || 'غير محدد')}</span>
          </div>
        </div>
      `).join('');
    }

    // Search input listener
    const searchInput = document.getElementById('search-input');
    const suggestionsBox = document.getElementById('suggestions-box');

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      renderMeds();

      if (!term) {
        suggestionsBox.classList.add('hidden');
        suggestionsBox.innerHTML = '';
        return;
      }

      const matches = allMeds.filter(m => m.name.toLowerCase().startsWith(term));
      if (matches.length === 0) {
        suggestionsBox.classList.add('hidden');
        suggestionsBox.innerHTML = '';
        return;
      }

      suggestionsBox.innerHTML = matches.map(m => `
        <div onclick="selectSuggestion('${escapeHtml(m.name)}')" class="px-3.5 py-2 hover:bg-slate-50 cursor-pointer text-xs text-slate-700 border-b border-slate-100 last:border-none flex justify-between items-center">
          <span class="font-bold">${escapeHtml(m.name)}</span>
          <span class="text-[10px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">x${m.quantity}</span>
        </div>
      `).join('');
      
      suggestionsBox.classList.remove('hidden');
    });

    function selectSuggestion(name) {
      searchInput.value = name;
      suggestionsBox.classList.add('hidden');
      renderMeds();
    }

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.classList.add('hidden');
      }
    });

    // Modals
    function openModal() {
      document.getElementById('med-id').value = '';
      document.getElementById('add-form').reset();
      document.getElementById('qty').value = 1;
      document.getElementById('modal-title').innerText = 'إضافة دواء جديد';
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeModal() { 
      document.getElementById('add-modal').classList.add('hidden'); 
    }

    function openManageModal() {
      document.getElementById('manage-modal').classList.remove('hidden');
    }

    function closeManageModal() {
      document.getElementById('manage-modal').classList.add('hidden');
    }

    function editMed(id) {
      const med = allMeds.find(m => m.id === id);
      if (!med) return;

      document.getElementById('med-id').value = med.id;
      document.getElementById('name').value = med.name || '';
      document.getElementById('qty').value = med.quantity || 1;
      document.getElementById('exp').value = med.exp || '';
      document.getElementById('loc').value = med.loc || '';
      document.getElementById('notes').value = med.notes || '';
      
      document.getElementById('modal-title').innerText = 'تعديل بيانات الدواء';
      document.getElementById('add-modal').classList.remove('hidden');
    }

    // Submit Form
    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('med-id').value;
      
      const medData = {
        id: id ? id : 'med_' + Date.now(),
        name: document.getElementById('name').value.trim(),
        quantity: parseInt(document.getElementById('qty').value) || 1,
        exp: document.getElementById('exp').value,
        loc: document.getElementById('loc').value.trim(),
        notes: document.getElementById('notes').value.trim()
      };

      if (id) {
        const index = allMeds.findIndex(m => m.id === id);
        if (index !== -1) allMeds[index] + (allMeds[index] = medData);
        // Correct assignment
        allMeds[index] = medData;
      } else {
        allMeds.unshift(medData);
      }

      localStorage.setItem('family_pharmacy_data', JSON.stringify(allMeds));
      refreshApp();
      document.getElementById('add-form').reset();
      closeModal();
    });

    function deleteMed(id) {
      if (confirm("هل تريد إزالة هذا الدواء؟")) {
        allMeds = allMeds.filter(m => m.id !== id);
        localStorage.setItem('family_pharmacy_data', JSON.stringify(allMeds));
        refreshApp();
      }
    }

    function shareApp() {
      const url = window.location.href;
      const text = `صيدلية العائلة - تابع الأدوية المتوفرة في المنزل عبر الرابط:\n${url}`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Initialize
    refreshApp();
  </script>
</body>
</html>
